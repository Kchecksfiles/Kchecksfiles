<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    .marquee-container {
      width: 100%;
      overflow: hidden;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 16px 0;
      white-space: nowrap;
      position: relative;
    }
    /* Edge fade masks */
    .marquee-container::before,
    .marquee-container::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 60px;
      z-index: 2;
      pointer-events: none;
    }
    .marquee-container::before {
      left: 0;
      background: linear-gradient(to right, #0d1117, transparent);
    }
    .marquee-container::after {
      right: 0;
      background: linear-gradient(to left, #0d1117, transparent);
    }
    .marquee-track {
      display: inline-flex;
      gap: 16px;
      animation: marquee-scroll 22s linear infinite;
    }
    .marquee-track:hover {
      animation-play-state: paused;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 10px 18px;
      color: #c9d1d9;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .badge:hover {
      background: #21262d;
      border-color: #58a6ff;
      transform: translateY(-2px);
      color: #58a6ff;
    }
    .badge img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      border-radius: 4px;
    }
    @keyframes marquee-scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
  </style>
</head>
