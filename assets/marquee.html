<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1117; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .marquee { display: flex; width: 100vw; overflow: hidden; padding: 12px 0; position: relative; }
    .track { display: flex; gap: 16px; animation: scroll 15s linear infinite; white-space: nowrap; }
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 8px 16px;
      color: #c9d1d9;
      font-size: 14px;
      font-weight: 600;
    }
    .badge img { width: 28px; height: 28px; border-radius: 4px; object-fit: contain; }
  </style>
</head>
<body>
  <div class="marquee">
    <div class="track">
      <!-- Set 1 -->
      <div class="badge"><img src="assets/logos/pixelos.png"> PixelOS</div>
      <div class="badge"><img src="assets/logos/homebrew.png"> LG webOS</div>
      <div class="badge"><img src="assets/logos/tizenbrew.png"> TizenBrew</div>
      <div class="badge"><img src="assets/logos/lineageos.png"> LineageOS</div>
      <div class="badge"><img src="assets/logos/linux.png"> Zorin OS</div>
      <div class="badge"><img src="assets/logos/shredpack.png"> ShredPack</div>
      <div class="badge"><img src="assets/logos/lenovo-fan-control.png"> Fan Control</div>
      <div class="badge"><img src="assets/logos/pc-building.png"> PC Building</div>
      <div class="badge"><img src="assets/logos/chrome-extensions.png"> Extensions</div>
      <div class="badge"><img src="assets/logos/debloating-terminal.png"> Debloating</div>

      <!-- Set 2 (Duplicate for Seamless Loop) -->
      <div class="badge"><img src="assets/logos/pixelos.png"> PixelOS</div>
      <div class="badge"><img src="assets/logos/homebrew.png"> LG webOS</div>
      <div class="badge"><img src="assets/logos/tizenbrew.png"> TizenBrew</div>
      <div class="badge"><img src="assets/logos/lineageos.png"> LineageOS</div>
      <div class="badge"><img src="assets/logos/linux.png"> Zorin OS</div>
      <div class="badge"><img src="assets/logos/shredpack.png"> ShredPack</div>
      <div class="badge"><img src="assets/logos/lenovo-fan-control.png"> Fan Control</div>
      <div class="badge"><img src="assets/logos/pc-building.png"> PC Building</div>
      <div class="badge"><img src="assets/logos/chrome-extensions.png"> Extensions</div>
      <div class="badge"><img src="assets/logos/debloating-terminal.png"> Debloating</div>
    </div>
  </div>
</body>
</html>
