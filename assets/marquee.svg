<svg xmlns="http://www.w3.org/2000/svg" width="900" height="90" viewBox="0 0 900 90" fill="none">
  <style>
    .marquee-track {
      animation: scroll 24s linear infinite;
    }
    .marquee-track:hover {
      animation-play-state: paused;
    }
    @keyframes scroll {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-2000px); }
    }
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 600;
      fill: #e6edf3;
    }
  </style>

  <!-- Background Card Container -->
  <rect width="100%" height="100%" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1" />

  <g class="marquee-track">
    <!-- Set 1 -->
    <g transform="translate(15, 15)">
      <rect width="180" height="60" rx="10" fill="#161b22" stroke="#30363d" />
      
      <text x="60" y="36">PixelOS</text>
    </g>
    <g transform="translate(210, 15)">
      <rect width="190" height="60" rx="10" fill="#161b22" stroke="#30363d" />
      
      <text x="60" y="36">LG webOS</text>
