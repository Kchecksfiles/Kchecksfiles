<svg xmlns="http://www.w3.org/2000/svg" width="900" height="70" viewBox="0 0 900 70" fill="none">
  <style>
    .marquee-track {
      animation: scroll 22s linear infinite;
    }
    .marquee-track:hover {
      animation-play-state: paused;
    }
    @keyframes scroll {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-1855px); }
    }
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      fill: #c9d1d9;
    }
  </style>

  <!-- Container Box -->
  <rect width="100%" height="100%" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1" />

  <g class="marquee-track">
    <!-- Set 1 -->
